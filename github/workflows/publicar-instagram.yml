name: .github/workflows/publicar-instagram.yml

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      solo_prueba:
        description: "Generar la placa sin publicar en Instagram"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: fmvida-instagram-auto
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      META_API_VERSION: v25.0

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar componentes
        run: pip install -r requirements.txt

      - name: Detectar noticias y generar placas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.solo_prueba }}" = "true" ]; then
            python scripts/fmvida_auto.py scan --test
          else
            python scripts/fmvida_auto.py scan
          fi

      - name: Guardar placas para que Instagram pueda leerlas
        run: |
          git config user.name "FM Vida Automatización"
          git config user.email "actions@users.noreply.github.com"
          git add public/cards data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Preparar nuevas noticias para Instagram"
            git push
          fi

      - name: Publicar o comprobar en modo seguro
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.solo_prueba }}" = "true" ]; then
            python scripts/fmvida_auto.py publish --dry-run
          else
            python scripts/fmvida_auto.py publish
          fi

      - name: Guardar registro de publicaciones
        if: always()
        run: |
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar registro de publicaciones"
            git push
          fi
